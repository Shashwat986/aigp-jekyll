url: "https://aigp.org.in"
baseurl: ""
permalink: pretty
future: true
title: "AIGP"
description: "Looking for Indians who are interested in the game of Go, and willing to play this wonderful strategy game. Go, also called baduk, weiqi, or igo is a popular strategy game with a very rich history, still in its infancy in India. Help us get bigger!"

# logo: "assets/images/logo/logo.svg"
logo: "assets/images/logo.webp"
site_logo:
  # mobile: "assets/images/logo/logo-mobile.svg"
  mobile: "assets/images/logo-160.webp"
  mobile_height: "87"
  mobile_width: "160"
  # desktop: "assets/images/logo/logo.svg"
  desktop: "assets/images/logo-160.webp"
  desktop_height: "87"
  desktop_width: "160"

collections:
  news:
    output: true
    permalink: /news/:year/:month/:day/:title/
  notices:
    output: true
    permalink: /notices/:year/:month/:day/:title/
  events:
    output: true
    permalink: /events/:path/

defaults:
  - scope:
      path: "_news"
      type: "news"
    values:
      layout: "news_post"
  - scope:
      path: "_notices"
      type: "notices"
    values:
      layout: "notice_post"
  - scope:
      path: "_events"
      type: "events"
    values:
      layout: "event_post"
  - scope:
      path: "_pages"
    values:
      layout: "page"

include:
  - _pages
  - _redirects

# Pagination
pagination:
  enabled: true
  collection: 'news'
  per_page: 10
  permalink: '/page/:num/'
  title: ' - page :num'
  sort_field: 'date'
  sort_reverse: true


sass:
  style: compressed
  quiet_deps: true
  load_paths:
    - _sass
    - _sass/bootstrap

plugins:
  - jekyll-environment-variables
  - jekyll-seo-tag
  - jekyll-paginate-v2
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
