<div id="main-menu" class="main-menu hidden md:block">
  {% assign mainmenu = site.data.menus.main | sort: 'weight'  %}
  <ul class="flex items-center gap-1 text-sm font-bold tracking-wide text-white">
    {% for item in mainmenu %}
    {% include menu-item.html item=item mode="desktop" %}
    {% endfor %}
  </ul>
</div>
