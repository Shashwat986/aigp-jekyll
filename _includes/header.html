<div class='header text-white shadow-md border-b border-white/10 transition-colors duration-300 py-4 {{ include.headerClass }}'>
  <div class="container mx-auto px-4 flex items-center justify-between">
    <div class="site-header-logo site-header-logo--desktop hidden md:block transition-transform duration-300 hover:scale-105">
      <a href="{{ '/' | relative_url }}">
        <img width="{{ site.site_logo.desktop_width }}" height="{{ site.site_logo.desktop_height }}" alt="{{ site.title }}" src="{{ site.site_logo.desktop | relative_url }}" />
      </a>
    </div>
    <div class="site-header-logo site-header-logo--mobile block md:hidden transition-transform duration-300 hover:scale-105">
      <a href="{{ '/' | relative_url }}">
        <img width="{{ site.site_logo.mobile_width }}" height="{{ site.site_logo.mobile_height }}" alt="{{ site.title }}" src="{{ site.site_logo.mobile | relative_url }}" />
      </a>
    </div>

    <div class="flex items-center gap-3">
      <button id="theme-toggle" type="button" class="p-2 rounded-lg text-white hover:bg-white/10 transition-all focus:outline-none cursor-pointer" aria-label="Toggle theme">
        <svg id="theme-toggle-dark-icon" class="hidden" width="20" height="20" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        <svg id="theme-toggle-light-icon" class="hidden" width="20" height="20" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
      </button>
      {% include main-menu.html %}
    </div>
    {% include hamburger.html %}
  </div>
</div>

<script>
  var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
  var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

  if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      themeToggleLightIcon.classList.remove('hidden');
  } else {
      themeToggleDarkIcon.classList.remove('hidden');
  }

  var themeToggleBtn = document.getElementById('theme-toggle');

  themeToggleBtn.addEventListener('click', function() {
      themeToggleDarkIcon.classList.toggle('hidden');
      themeToggleLightIcon.classList.toggle('hidden');

      if (document.documentElement.classList.contains('dark')) {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-bs-theme', 'light');
          localStorage.setItem('color-theme', 'light');
      } else {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-bs-theme', 'dark');
          localStorage.setItem('color-theme', 'dark');
      }
  });
</script>
