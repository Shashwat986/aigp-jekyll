    function registerCMSPlugins() {
      if (window.CMS && typeof window.CMS.registerCustomFormat === 'function') {
        // Define alias to avoid ReferenceError with lowercase/uppercase jsyaml library exported name
        var jsYaml = window.jsyaml || window.jsYaml;

        function formatPreviewDate(dateVal, options) {
          if (!dateVal) return '';
          try {
            var d;
            if (dateVal._isAMomentObject || (typeof dateVal.toDate === 'function')) {
              d = dateVal.toDate();
            } else {
              d = new Date(dateVal);
            }
            if (isNaN(d.getTime())) return dateVal;
            return d.toLocaleDateString('en-US', options);
          } catch (e) {
            return dateVal.toString();
          }
        }

        // Helper to format date matching the public site (Month DD, YYYY)
        function formatDate(dateVal) {
          return formatPreviewDate(dateVal, { month: 'long', day: 'numeric', year: 'numeric' });
        }

        function formatShortDate(dateVal) {
          return formatPreviewDate(dateVal, { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function plainText(value) {
          return (value || '').toString().replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
        }

        function truncateText(value, limit) {
          var text = plainText(value);
          if (text.length <= limit) return text;
          return text.slice(0, limit - 3).trim() + '...';
        }

        function entryValue(entry, key, fallback) {
          var value = entry.getIn(['data', key]);
          return value === undefined || value === null ? fallback : value;
        }

        function toJS(value) {
          if (!value) return value;
          if (typeof value.toJS === 'function') return value.toJS();
          if (typeof value.toArray === 'function') return value.toArray();
          return value;
        }

        function toList(value) {
          var jsValue = toJS(value);
          if (!jsValue) return [];
          if (Array.isArray(jsValue)) return jsValue;
          return [jsValue];
        }

        function toDelimitedList(value) {
          var jsValue = toJS(value);
          if (!jsValue) return [];
          if (Array.isArray(jsValue)) return jsValue;
          if (typeof jsValue === 'string') {
            return jsValue.split(',').map(function(item) { return item.trim(); }).filter(Boolean);
          }
          return [jsValue];
        }

        function itemValue(item, key, fallback) {
          if (!item) return fallback;
          if (typeof item.get === 'function') {
            var value = item.get(key);
            return value === undefined || value === null ? fallback : value;
          }
          return item[key] === undefined || item[key] === null ? fallback : item[key];
        }

        function previewSlug(entry) {
          return entry.get('slug') || entry.get('path') || entry.getIn(['data', 'title']) || '';
        }

        function slugifyForUrl(value) {
          return (value || '').toString().trim().toLowerCase()
            .replace(/&/g, ' and ')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');
        }

        function entryFileName(entry) {
          var path = entry.get('path') || '';
          return path.split('/').pop() || '';
        }

        function buildDatedEntryUrl(entry, prefix) {
          var fileName = entryFileName(entry);
          var match = fileName.match(/^(\d{4})-(\d{2})-(\d{2})-(.+)\.md$/);
          if (match) {
            return '/' + prefix + '/' + match[1] + '/' + match[2] + '/' + match[3] + '/' + match[4] + '/';
          }

          var date = entryValue(entry, 'date', '');
          var titleSlug = slugifyForUrl(entryValue(entry, 'title', ''));
          if (!date || !titleSlug) return '#';

          var dateMatch = date.toString().match(/^(\d{4})-(\d{2})-(\d{2})/);
          if (!dateMatch) return '#';
          var year = dateMatch[1];
          var month = dateMatch[2];
          var day = dateMatch[3];
          return '/' + prefix + '/' + year + '/' + month + '/' + day + '/' + titleSlug + '/';
        }

        function buildSimpleEntryUrl(entry, prefix) {
          var fileName = entryFileName(entry).replace(/\.md$/, '');
          var slug = fileName || slugifyForUrl(entryValue(entry, 'title', ''));
          return slug ? '/' + prefix + '/' + slug + '/' : '#';
        }

        function externalLinkProps(url) {

                  { label: 'AIGP', key: 'aigp_created' },
                  { label: 'Button', key: 'link_label' }
                ])
              );
            } else if (hasDataKey('executive_members') || hasDataKey('zonal_heads') || slug.indexOf('team_structure') !== -1) {
              title = 'Team Structure';
              subtitle = 'Editable association support and community structure tables.';
              var executives = toList(entry.getIn(['data', 'executive_members']));
              var zones = toList(entry.getIn(['data', 'zonal_heads']));
              var channels = toList(entry.getIn(['data', 'community_channels']));
              content = h('div', null,
                h('div', { className: 'preview-stat-row' },
                  renderStat(executives.length, 'Executives'),
                  renderStat(zones.length, 'Zonal heads'),
                  renderStat(channels.length, 'Channels')
                ),
                executives.length ? h('div', { style: { marginTop: '28px' } },
                  h('h2', { className: 'preview-section-title' }, 'Executive Members'),
                  renderDataTable(executives.map(function(member) {
                    return typeof member === 'string' ? { name: member } : member;
                  }), [
                    { label: 'Image', key: 'image', render: function(value, row) {
                      return renderAssetThumb(value, row, this.props.getAsset, 'image_alt', 'name');
                    }.bind(this) },
                    { label: 'Name', key: 'name', render: function(value) { return h('span', { className: 'data-table__primary' }, renderDataValue(value)); } }
                  ])
                ) : null,
                zones.length ? h('div', { style: { marginTop: '28px' } },
                  h('h2', { className: 'preview-section-title' }, 'Zonal Heads'),
                  renderDataTable(zones, [
                    { label: 'Image', key: 'image', render: function(value, row) {
                      return renderAssetThumb(value, row, this.props.getAsset, 'image_alt', 'name');
                    }.bind(this) },
                    { label: 'Name', key: 'name', render: function(value) { return h('span', { className: 'data-table__primary' }, renderDataValue(value)); } },
                    { label: 'Zone', key: 'zone' },
                    { label: 'Activity', key: 'activity' },
                    { label: 'Members', key: 'active_members' },
                    { label: 'Outreach', key: 'outreach' },
                    { label: 'Reach', key: 'outreach_reach' }
                  ])
                ) : null,
                channels.length ? h('div', { style: { marginTop: '28px' } },
                  h('h2', { className: 'preview-section-title' }, 'Community Channels'),
                  renderDataTable(channels, [
                    { label: 'Channel', key: 'name', render: function(value) { return h('span', { className: 'data-table__primary' }, renderDataValue(value)); } },
                    { label: 'Members', key: 'members' }
                  ])
                ) : null
              );
            } else if (hasDataKey('team') || slug.indexOf('team') !== -1) {
              title = 'Core Team';
              subtitle = 'Editable core team data table.';
              var team = toList(entry.getIn(['data', 'team']));
              content = h('div', null,
                h('div', { className: 'preview-stat-row' }, renderStat(team.length, 'Team members')),
                renderDataTable(team, [
                  { label: 'Image', key: 'image', render: function(value, row) {
                    return renderAssetThumb(value, row, this.props.getAsset, 'image_alt', 'name');
                  }.bind(this) },
                  { label: 'Name', key: 'name', render: function(value) { return h('span', { className: 'data-table__primary' }, renderDataValue(value)); } },
                  { label: 'Role', key: 'role' },
                  { label: 'Bio', key: 'bio' },
                  { label: 'Responsibilities', key: 'responsibilities' },
                  { label: 'Link', key: 'link' }
                ])
              );
            } else if (hasDataKey('contributors') || slug.indexOf('contributors') !== -1) {
              title = 'Team Page Contributor List';
              subtitle = 'Editable contributor data table.';
              var contributors = toList(entry.getIn(['data', 'contributors']));
              content = h('div', null,
                h('div', { className: 'preview-stat-row' }, renderStat(contributors.length, 'Contributors')),
                renderDataTable(contributors, [
                  { label: 'Image', key: 'image', render: function(value, row) {
                    return renderAssetThumb(value, row, this.props.getAsset, 'image_alt', 'name');
                  }.bind(this) },
                  { label: 'Name', key: 'name', render: function(value) { return h('span', { className: 'data-table__primary' }, renderDataValue(value)); } },
                  { label: 'Role', key: 'role' },
                  { label: 'Group', key: 'group' },
                  { label: 'Location', key: 'location' },
                  { label: 'Contribution', key: 'contribution' }
                ])
              );
            } else if (hasDataKey('collaborators') || slug.indexOf('partner_data') !== -1) {
              title = 'Partners And Supporters';
              subtitle = 'Editable collaborator cards used on the Partners page.';
              var collaborators = toList(entry.getIn(['data', 'collaborators']));
              content = h('div', null,
                h('div', { className: 'preview-stat-row' }, renderStat(collaborators.length, 'Collaborators')),
                renderDataTable(collaborators, [
                  { label: 'Name', key: 'name', render: function(value) { return h('span', { className: 'data-table__primary' }, renderDataValue(value)); } },
                  { label: 'Description', key: 'description' },
                  { label: 'Website', key: 'url' },
                  { label: 'Link Label', key: 'link_label' }
                ])
              );
            } else if (hasDataKey('support_options') || slug.indexOf('support') !== -1) {
              title = 'Partners And Support';
              subtitle = 'Editable support option data table.';
              var supportOptions = toList(entry.getIn(['data', 'support_options']));
              var policy = toJS(entry.getIn(['data', 'policy'])) || {};
              content = h('div', null,
                h('div', { className: 'preview-stat-row' },
                  renderStat(supportOptions.length, 'Support routes'),
                  renderStat(policy.accepts_online_donations ? 'Yes' : 'No', 'Online donations')
                ),
                renderPreviewSection('Donation Policy',
                  renderDataTable([policy], [
                    { label: 'Accepts Online Donations', key: 'accepts_online_donations' },
                    { label: 'Message', key: 'message' }
                  ])
                ),
                renderPreviewSection('Support Options',
                  renderDataTable(supportOptions, [
                    { label: 'Title', key: 'title', render: function(value) { return h('span', { className: 'data-table__primary' }, renderDataValue(value)); } },
                    { label: 'Summary', key: 'summary' },
                    { label: 'Contact Label', key: 'contact_label' },
                    { label: 'Contact URL', key: 'contact_url' }
                  ])
                )
              );
            } else if (hasDataKey('reports') || slug.indexOf('annual_reports') !== -1) {
              title = 'Annual Reports';
              subtitle = 'Editable annual report data table.';
              var reports = toList(entry.getIn(['data', 'reports']));
              content = h('div', null,
                h('div', { className: 'preview-stat-row' }, renderStat(reports.length, 'Reports')),
                renderDataTable(reports, [
                  { label: 'Year', key: 'year', render: function(value) { return h('span', { className: 'data-table__primary' }, renderDataValue(value)); } },
                  { label: 'Status', key: 'status' },
                  { label: 'Summary', key: 'summary' },
                  { label: 'Highlights', key: 'highlights' },
                  { label: 'Links', key: 'links', render: function(value) {
                    return renderChipList(toList(value).map(function(link) {
                      return [itemValue(link, 'label', ''), itemValue(link, 'url', '')].filter(Boolean).join(': ');
                    }));
                  } }
                ])
              );
            } else if (hasDataKey('representatives') || slug.indexOf('representatives') !== -1) {
              title = 'Representatives';
              subtitle = 'Editable representative record data table.';
              var representatives = toList(entry.getIn(['data', 'representatives']));
              content = h('div', null,
                h('div', { className: 'preview-stat-row' }, renderStat(representatives.length, 'Representative records')),
                renderDataTable(representatives, [
                  { label: 'Year', key: 'year' },
                  { label: 'Event', key: 'event', render: function(value) { return h('span', { className: 'data-table__primary' }, renderDataValue(value)); } },
                  { label: 'Representative', key: 'representative' },
                  { label: 'Notes', key: 'notes' },
                  { label: 'Source URL', key: 'source_url' }
                ])
              );
            } else {
              content = h('div', { className: 'official-card official-card--flat' },
                h('div', { className: 'official-card__body' },
                  h('p', { className: 'official-card__text' }, 'This data file uses the public card preview styles. Save and view the linked public page for the complete layout.')
                )
              );
            }

            return h('div', { className: 'preview-page' },
              h('style', { type: 'text/css' }, basePreviewStyles()),
              h('div', { className: 'preview-container' },
                h('div', { className: 'section-heading' },
                  h('span', { className: 'section-eyebrow' }, subtitle),
                  h('h1', { className: 'section-title' }, title)
                ),
                content
              )
            );
          }
        });

        var OfficialPagePreview = createClass({
          render: function() {
            var entry = this.props.entry;
            var title = entryValue(entry, 'title', 'Official Page');
            var description = entryValue(entry, 'description', '');
            var pagePath = entry.get('path') || '';
            var pageLabel = pagePath ? pagePath.replace(/^_pages\//, '').replace(/\.md$/, '') : 'official page';
            return h('div', { className: 'preview-page' },
              h('style', { type: 'text/css' }, basePreviewStyles()),
              h('div', { className: 'preview-container preview-container--narrow' },
                h('div', { className: 'section-heading' },
                  h('span', { className: 'section-eyebrow' }, pageLabel + ' preview'),
                  h('h1', { className: 'section-title' }, title),
                  description ? h('p', { className: 'section-summary' }, description) : null
                ),
                h('article', { className: 'official-card official-card--flat' },
                  h('div', { className: 'official-card__body' },
                    renderMarkdownPreview(this.props.widgetFor('body'), 'content content--page')
                  )
                )
              )
            );
          }
        });

        function registerPreviewTemplateAliases(names, component) {
          names.forEach(function(name) {
            CMS.registerPreviewTemplate(name, component);
          });
        }

        CMS.registerPreviewTemplate("news", PostPreview);
        CMS.registerPreviewTemplate("notices", NoticePreview);
        CMS.registerPreviewTemplate("events", EventPreview);
        registerPreviewTemplateAliases([
          "site_data",
          "resources",
          "team",
          "team_structure",
          "support",
          "annual_reports",
          "representatives",
          "contributors",
          "site_data.resources",
          "site_data.team",
          "site_data.team_structure",
          "site_data.support",
          "site_data.partner_data",
          "site_data.annual_reports",
          "site_data.representatives",
          "site_data.contributors"
        ], SiteDataPreview);
        registerPreviewTemplateAliases([
          "official_pages",
          "about",
          "representation",
          "outreach",
          "partners",
          "code_of_conduct",
          "constitution",
          "contact_escalation",
          "privacy",
          "terms",
          "official_pages.about",
          "official_pages.representation",
          "official_pages.outreach",
          "official_pages.partners",
          "official_pages.code_of_conduct",
          "official_pages.constitution",
          "official_pages.contact_escalation",
          "official_pages.privacy",
          "official_pages.terms"
        ], OfficialPagePreview);

        CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap");

        // Register custom yaml-frontmatter formatter to enforce double quotes on the date field on save
        CMS.registerCustomFormat('yaml-frontmatter', 'md', {
          fromFile: function(text) {
            var match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
            if (!match) {
              match = text.match(/^---\r?\n([\s\S]*?)\r?\n---([\s\S]*)$/);
            }
            if (match) {
              var yamlStr = match[1];
              var body = match[2];
              var obj = jsYaml.load(yamlStr) || {};
              obj.body = body;
              return obj;
            }
            return { body: text };
          },
          toFile: function(obj) {
            var body = obj.body || '';
            var frontmatterObj = Object.assign({}, obj);
            delete frontmatterObj.body;

            var yamlStr = jsYaml.dump(frontmatterObj, {
              noRefs: true,
              lineWidth: -1
            });

            // Regex to wrap date value in double quotes
            yamlStr = yamlStr.replace(/^date:\s*['"]?([^'\n\r"]+)['"]?/m, 'date: "$1"');

            return '---\n' + yamlStr.trim() + '\n---\n' + body;
          }
        });
      } else {
        // Wait and try again
        setTimeout(registerCMSPlugins, 50);
      }
    }

    // Start the process
    registerCMSPlugins();
  </script>
</body>
</html>
